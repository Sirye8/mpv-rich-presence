# Settings guide: https://github.com/Sirye8/mpv-rich-presence/blob/main/docs/user-guide.md#configure-startup-defaults

# The bundled Discord application ID works as-is. Set on=no to start with sharing off.
application_id=1462038267183628308
on=yes

# Folder filtering mode: "whitelist", "blacklist", or "disabled"
folder_filter_mode=disabled

# Semicolon-separated list of absolute folder paths (quotes optional).
# Used when folder_filter_mode is "whitelist" or "blacklist".
# Example: D:\Anime;E:\Videos\Movies
folder_list=

# Default recognition: auto, anime, movie-tv, movie, tv, original, or local.
# In the panel, a file, folder, or global override takes priority over this value.
recognition_source=auto

# Pause timeout in seconds. After being paused this long, RPC is hidden.
# Set to 0 to never auto-hide on pause.
pause_timeout=1800

# Discord card preset: original, clean, detailed, or private.
appearance_preset=original

# Player panel shortcut, size multiplier, and transitions.
menu_key=Alt+p
menu_scale=1
menu_animations=yes
# top-left, top-center, top-right, bottom-left, bottom-center, bottom-right
panel_position=top-left

# Empty uses bundled Python on Windows when available, or python (Windows) / python3 (Linux).
# Set an executable path to choose another interpreter.
# python=

# Use the bundled public AniList client, or set your own public client ID.
# Use anilist_personal_client=yes for a client registered with the localhost callback.
# A custom hosted exchange uses an HTTPS origin without a trailing slash.
anilist_client_id=55822
anilist_personal_client=no
anilist_exchange_url=

# Optional local provider overrides. TMDB expects an API Read Access Token.
# AcoustID expects an application key. Empty uses the project defaults.
tmdb_key=
acoustid_key=
