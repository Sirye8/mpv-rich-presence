# Discord Application ID (from https://discord.com/developers/applications)
application_id=1462038267183628308
on=yes

# Folder filtering mode: "whitelist", "blacklist", or "disabled"
folder_filter_mode=disabled

# Semicolon-separated list of absolute folder paths (quotes optional).
# Used when folder_filter_mode is "whitelist" or "blacklist".
# Example: D:\Anime;E:\Videos\Movies
folder_list=

# Default recognition: auto, anime, movie-tv, movie, tv, or original.
# In the panel, a file, folder, or global override takes priority over this value.
recognition_source=auto

# Pause timeout in seconds. After being paused this long, RPC is hidden.
# Set to 0 to never auto-hide on pause.
pause_timeout=1800

# Player panel
appearance_preset=original
menu_key=Alt+p
menu_scale=1
menu_animations=yes
# top-left, top-center, top-right, bottom-left, bottom-center, bottom-right
panel_position=top-left

# The Windows ZIP includes Python. On Linux, the helper uses python3.
# Set a path here to choose a different interpreter.
# python=
anilist_client_id=55822
anilist_personal_client=no
anilist_exchange_url=

# Optional provider overrides. The packages supply the default services.
tmdb_key=
acoustid_key=
